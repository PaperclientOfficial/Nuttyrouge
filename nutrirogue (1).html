<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriRogue</title>
<style>
:root{
  --bg:#030712; --bg2:#0b1120; --panel:rgba(15,23,42,.86); --panel2:rgba(30,41,59,.62);
  --border:rgba(148,163,184,.15); --text:#f8fafc; --muted:#94a3b8;
  --purple:#8b5cf6; --purple2:#a78bfa; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --yellow:#f59e0b; --pink:#ec4899;
}
*{box-sizing:border-box;}
html{min-height:100%;}
body{
  margin:0; min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%, rgba(139,92,246,.22), transparent 25%),
    radial-gradient(circle at 85% 15%, rgba(59,130,246,.17), transparent 24%),
    radial-gradient(circle at 50% 100%, rgba(236,72,153,.10), transparent 35%),
    linear-gradient(135deg,#020617,#080d1c 45%,#020617);
  overflow-x:hidden;
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.4;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px),
    radial-gradient(circle, rgba(255,255,255,.6) .8px, transparent 1px);
  background-size:75px 75px,140px 140px; background-position:0 0,40px 60px; z-index:-1;
}
button,input,textarea{font:inherit;}
button{cursor:pointer;}
.app{width:min(1200px,calc(100% - 30px)); margin:auto; padding:20px 0 70px;}

.header{
  display:flex; justify-content:space-between; align-items:center; gap:15px;
  padding:15px 18px; border:1px solid var(--border); border-radius:22px;
  background:rgba(15,23,42,.72); backdrop-filter:blur(25px);
  box-shadow:0 25px 80px rgba(0,0,0,.35); margin-bottom:18px;
}
.brand{display:flex; align-items:center; gap:13px;}
.logo{
  width:52px; height:52px; display:grid; place-items:center; font-size:26px; border-radius:17px;
  background:linear-gradient(135deg,var(--blue),var(--purple),var(--pink));
  box-shadow:0 0 35px rgba(139,92,246,.35);
}
.brand h1{margin:0; font-size:19px;}
.brand p{margin:4px 0 0; color:var(--muted); font-size:12px;}
.stats{display:flex; flex-wrap:wrap; gap:7px;}
.stat{min-width:72px; text-align:center; padding:7px 10px; border:1px solid var(--border); border-radius:12px; background:rgba(2,6,23,.5);}
.stat small{display:block; color:var(--muted); font-size:9px; letter-spacing:.08em;}
.stat strong{font-size:15px;}

.game{
  min-height:650px; padding:25px; border:1px solid var(--border); border-radius:28px;
  background:var(--panel); backdrop-filter:blur(22px); box-shadow:0 30px 100px rgba(0,0,0,.35);
}

.btn{
  padding:12px 17px; border:1px solid var(--border); border-radius:13px; color:white;
  background:rgba(30,41,59,.75); transition:transform .18s,border-color .18s,background .18s;
  user-select:none;
}
.btn:hover{transform:translateY(-2px); border-color:rgba(167,139,250,.8);}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
.primary{border:none; background:linear-gradient(135deg,#6366f1,#8b5cf6); box-shadow:0 10px 30px rgba(99,102,241,.25);}
.green{border:none; background:linear-gradient(135deg,#16a34a,#22c55e);}
.red{border:none; background:linear-gradient(135deg,#dc2626,#ef4444);}
.button-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px;}

.start-screen{text-align:center; padding:80px 20px;}
.start-icon{font-size:85px;}
.start-screen h2{font-size:clamp(35px,7vw,55px); margin:15px 0 10px;}
.start-screen p{max-width:650px; margin:0 auto 25px; color:var(--muted); line-height:1.7;}

.level-box{max-width:500px; margin:20px auto; text-align:left;}
.level-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:7px; color:var(--muted);}
.xp-bar{height:11px; overflow:hidden; border-radius:999px; background:rgba(148,163,184,.13);}
.xp-fill{height:100%; transition:width .4s; background:linear-gradient(90deg,var(--purple),var(--pink));}

/* ================= DUNGEON GRID (Rogue Legacy style) ================= */
.dungeon-title{text-align:center; margin-bottom:10px;}
.dungeon-title h2{margin:8px 0;}
.dungeon-title p{color:var(--muted);}
.dungeon-wrap{max-width:560px; margin:25px auto 10px;}
.dungeon-grid{display:grid; gap:6px; margin:0 auto;}
.dcell{
  position:relative; aspect-ratio:1/1; border-radius:10px; display:grid; place-items:center;
  font-size:20px; border:2px solid transparent; background:transparent; transition:.15s;
}
.dcell.empty{visibility:hidden;}
.dcell.hidden{background:rgba(15,23,42,.5); border-color:rgba(148,163,184,.08);}
.dcell.fog{background:rgba(30,41,59,.55); border-color:rgba(148,163,184,.2); color:var(--muted);}
.dcell.pending{background:rgba(245,158,11,.10); border-color:rgba(245,158,11,.4);}
.dcell.cleared{background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.35);}
.dcell.cleared.type-boss{background:rgba(236,72,153,.08); border-color:rgba(236,72,153,.4);}
.dcell.current{border-color:var(--yellow); box-shadow:0 0 18px rgba(245,158,11,.55); animation:pulse2 1.6s infinite;}
@keyframes pulse2{0%,100%{box-shadow:0 0 10px rgba(245,158,11,.35);}50%{box-shadow:0 0 22px rgba(245,158,11,.75);}}

.dpad-wrap{display:flex; align-items:center; justify-content:center; gap:22px; margin-top:22px; flex-wrap:wrap;}
.dpad{display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,44px); gap:5px;}
.dpad button{border-radius:10px; padding:0; font-size:16px;}
.dpad .k-w{grid-column:2; grid-row:1;}
.dpad .k-a{grid-column:1; grid-row:2;}
.dpad .k-s{grid-column:2; grid-row:2;}
.dpad .k-d{grid-column:3; grid-row:2;}
.controls-hint{color:var(--muted); font-size:12px; max-width:230px; line-height:1.6;}

.warp-panel{
  max-width:560px; margin:20px auto 0; padding:16px; border:1px solid rgba(139,92,246,.3);
  border-radius:16px; background:rgba(139,92,246,.08); text-align:center;
}
.warp-panel h3{margin:0 0 10px; font-size:14px;}
.warp-points{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px;}

/* ================= PHYSICAL ROOM (platformer) ================= */
.room-stage-wrap{max-width:640px; margin:20px auto 0; overflow-x:auto;}
.room-stage{
  position:relative; width:640px; height:230px; border-radius:18px;
  border:1px solid var(--border); background:linear-gradient(180deg,rgba(2,6,23,.2),rgba(2,6,23,.55));
  overflow:hidden;
}
.room-ground{position:absolute; left:0; right:0; bottom:0; height:20px; background:rgba(139,92,246,.18); border-top:2px solid rgba(139,92,246,.4);}
.room-platform{position:absolute; height:14px; border-radius:7px; background:rgba(59,130,246,.28); border-top:2px solid rgba(59,130,246,.55);}
.room-object{
  position:absolute; width:52px; height:52px; border-radius:14px; border:2px solid rgba(139,92,246,.4);
  background:rgba(30,41,59,.75); font-size:28px; display:grid; place-items:center; transform:translateX(-50%);
  animation:bob 2.2s ease-in-out infinite;
}
.room-object:hover{border-color:var(--purple); transform:translateX(-50%) scale(1.08);}
@keyframes bob{0%,100%{margin-bottom:0px;}50%{margin-bottom:6px;}}
.room-player{
  position:absolute; width:40px; height:40px; font-size:32px; display:grid; place-items:center;
  transform:translateX(-6px);
}
.room-controls{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; flex-wrap:wrap;}
.room-controls .btn{min-width:60px;}

/* ================= BATTLE ================= */
.battle-top{display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-bottom:25px;}
.player-side{flex:1; min-width:200px;}
.enemy-side{flex:1; min-width:200px; display:flex; flex-direction:column; gap:10px;}
.fighter{padding:17px; text-align:center; border:1px solid var(--border); border-radius:20px; background:rgba(2,6,23,.38);}
.fighter.enemy-target{cursor:pointer; transition:.15s;}
.fighter.enemy-target:hover{border-color:rgba(139,92,246,.6);}
.fighter.enemy-target.selected{border-color:var(--yellow); box-shadow:0 0 18px rgba(245,158,11,.4);}
.fighter.dead{opacity:.35; filter:grayscale(1);}
.fighter-icon{font-size:44px;}
.fighter-name{margin-top:8px; font-weight:bold; font-size:13px;}
.vs{font-size:20px; color:var(--purple); text-align:center;}
.health-bar{height:11px; margin-top:10px; overflow:hidden; border-radius:999px; background:rgba(148,163,184,.15);}
.health-fill{height:100%; border-radius:999px; transition:width .45s;}
.player-health{background:linear-gradient(90deg,#16a34a,#84cc16);}
.enemy-health{background:linear-gradient(90deg,#ef4444,#f97316);}
.hp-text{margin-top:7px; font-size:11px; color:var(--muted);}
.target-hint{text-align:center; font-size:11px; color:var(--purple2); margin-bottom:6px;}

.question-box{padding:23px; border:1px solid var(--border); border-radius:22px; background:rgba(2,6,23,.4);}
.badge{display:inline-block; padding:7px 10px; border-radius:999px; border:1px solid rgba(139,92,246,.35); color:#c4b5fd; background:rgba(139,92,246,.12); font-size:10px; letter-spacing:.1em; text-transform:uppercase;}
.question{margin:14px 0 0; font-size:clamp(21px,4vw,31px); line-height:1.35;}
.answers{display:grid; gap:10px; margin-top:20px;}
.answer{padding:15px; color:white; text-align:left; border:1px solid var(--border); border-radius:14px; background:rgba(30,41,59,.7); transition:.18s;}
.answer:hover{transform:translateY(-2px); border-color:rgba(139,92,246,.7);}
.answer.selected{border-color:var(--purple); background:rgba(139,92,246,.18);}
textarea,input{width:100%; margin-top:18px; padding:15px; color:white; outline:none; border:1px solid var(--border); border-radius:14px; background:rgba(2,6,23,.55);}
textarea{min-height:130px; resize:vertical;}
textarea:focus,input:focus{border-color:var(--purple);}

.feedback{display:none; margin-top:18px; padding:17px; border-radius:15px; line-height:1.6;}
.feedback.show{display:block;}
.feedback.correct{border:1px solid rgba(34,197,94,.3); background:rgba(34,197,94,.1); color:#bbf7d0;}
.feedback.partial{border:1px solid rgba(245,158,11,.3); background:rgba(245,158,11,.1); color:#fde68a;}
.feedback.wrong{border:1px solid rgba(239,68,68,.3); background:rgba(239,68,68,.1); color:#fecaca;}
.feedback.loading{border:1px solid rgba(139,92,246,.3); background:rgba(139,92,246,.1); color:#ddd6fe;}

.item-msg{margin-top:12px; padding:11px 14px; border-radius:12px; border:1px solid rgba(245,158,11,.35); background:rgba(245,158,11,.1); color:#fde68a; font-size:13px;}

.inventory{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px;}
.item-card{min-width:125px; padding:11px; border:1px solid var(--border); border-radius:13px; background:rgba(30,41,59,.55);}
.item-card .icon{font-size:23px;}
.item-card strong{display:block; margin-top:5px; font-size:11px;}
.item-card small{color:var(--muted); font-size:10px;}
.item-card .use-btn{margin-top:8px; width:100%; padding:6px; font-size:11px; border-radius:8px;}

.reward-grid,.shop-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:15px; margin-top:25px;}
.reward-card,.shop-item{position:relative; padding:19px; text-align:left; border:1px solid var(--border); border-radius:19px; color:white; background:rgba(30,41,59,.58); transition:.2s;}
.reward-card:hover,.shop-item:hover{transform:translateY(-5px); border-color:rgba(139,92,246,.7);}
.big-icon{font-size:40px;}
.reward-card h3,.shop-item h3{margin:10px 0 6px;}
.reward-card p,.shop-item p{color:var(--muted); font-size:13px; line-height:1.5;}
.cost{margin:14px 0; color:#fde68a; font-weight:bold;}

.result{text-align:center; padding:75px 20px;}
.result-icon{font-size:85px;}
.result h2{font-size:clamp(32px,6vw,48px);}
.story{color:var(--muted); line-height:1.7;}

@media(max-width:700px){
  .header{flex-direction:column; align-items:stretch;}
  .stats{justify-content:space-between;}
  .game{padding:15px;}
  .vs{display:none;}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand">
    <div class="logo">🧬</div>
    <div>
      <h1>NutriRogue</h1>
      <p>Näringslära • Roguelite • Åk 7</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><small>❤️ HP</small><strong id="hpStat">100/100</strong></div>
    <div class="stat"><small>⚔️ DMG</small><strong id="damageStat">20</strong></div>
    <div class="stat"><small>📈 LVL</small><strong id="levelStat">1</strong></div>
    <div class="stat"><small>💰 GOLD</small><strong id="goldStat">0</strong></div>
  </div>
</header>
<main class="game" id="game"></main>
</div>

<script>
/* ==========================================
   CONSTANTS
========================================== */
const GRID = 7;
const ROOM_W = 640, ROOM_H = 230, GROUND_H = 20;
const GRAVITY = 0.6, JUMP_V = 11, MOVE_SPEED = 4, PLAYER_W = 40;
const PLATFORM_X = 380, PLATFORM_W = 140, PLATFORM_Y = 90;

/* ==========================================
   GAME STATE
========================================== */
const state = {
  hp:100, maxHp:100, level:1, xp:0, xpNeeded:100, gold:0, damage:20,
  critChance:0, shield:0, streak:0, guaranteedCrit:false,
  inventory:[], warpPoints:[], dungeon:null, playerPos:{x:3,y:3},
  room:null,
  currentEnemies:[], targetIndex:0, currentQuestion:null, usedQuestions:[],
  currentView:"start", itemMessage:""
};

/* ==========================================
   QUESTIONS
========================================== */
const questions = [
  { id:"carbs", topic:"Kolhydrater", type:"choice",
    question:"Vilket livsmedel innehåller vanligtvis mycket kolhydrater?",
    options:[["🍝 Pasta",true],["🐟 Fisk",false],["🥚 Ägg",false],["🧀 Ost",false]],
    explanation:"Kolhydrater är en viktig energikälla. Pasta innehåller mycket kolhydrater." },
  { id:"protein", topic:"Protein", type:"text",
    question:"Förklara med egna ord varför kroppen behöver protein.",
    keywords:["bygga","reparera","muskler","muskel","celler","vävnad"],
    explanation:"Protein används bland annat för att bygga och reparera kroppens vävnader." },
  { id:"water", topic:"Vatten", type:"truefalse",
    question:"Kroppen behöver vatten för att fungera.", correct:true,
    explanation:"Vatten behövs för många viktiga funktioner i kroppen." },
  { id:"vitamins", topic:"Vitaminer", type:"blank",
    question:"________ behövs i små mängder och hjälper kroppen att fungera.",
    answers:["vitamin","vitaminer"],
    explanation:"Vitaminer behövs i små mängder men är ändå viktiga." },
  { id:"fat", topic:"Fett", type:"truefalse",
    question:"Allt fett är dåligt för kroppen.", correct:false,
    explanation:"Fett är ett viktigt näringsämne. Kroppen behöver bland annat vissa fetter." },
  { id:"drag", topic:"Sortering", type:"drag",
    question:"Dra varje livsmedel till rätt näringsgrupp.",
    categories:[["carbs","⚡ Kolhydrater"],["protein","💪 Protein"]],
    items:[["pasta","🍝 Pasta","carbs"],["bread","🍞 Bröd","carbs"],["egg","🥚 Ägg","protein"],["fish","🐟 Fisk","protein"]],
    explanation:"Pasta och bröd innehåller mycket kolhydrater. Fisk och ägg innehåller protein." },
  { id:"energy", topic:"Energi", type:"choice",
    question:"Vilket näringsämne är en viktig energikälla?",
    options:[["⚡ Kolhydrater",true],["🪨 Stenar",false],["🌫️ Rök",false],["🎨 Färg",false]],
    explanation:"Kolhydrater används som en viktig energikälla." },
  { id:"minerals", topic:"Mineraler", type:"text",
    question:"Vad tror du mineraler kan hjälpa kroppen med?",
    keywords:["skelett","tänder","blod","muskler","kroppen","nerv"],
    explanation:"Mineraler har många uppgifter, till exempel för skelett, blod och kroppens funktioner." }
];

/* ==========================================
   ENEMIES
========================================== */
const enemies = [
  { name:"Kolhydrat-Kaos", icon:"🍞", hp:60, gold:20, xp:40 },
  { name:"Protein Phantom", icon:"👻", hp:70, gold:25, xp:50 },
  { name:"Vitamin Goblin", icon:"👾", hp:75, gold:30, xp:60 },
  { name:"Näringsmyten", icon:"🌀", hp:80, gold:35, xp:70 }
];
const eliteEnemies = [
  { name:"ELITE: Processerade Panikern", icon:"👹", hp:170, gold:70, xp:130 },
  { name:"ELITE: Näringskaos", icon:"🌪️", hp:190, gold:80, xp:150 }
];
const bosses = [
  { name:"Näringsmästaren", icon:"👑", hp:340, gold:150, xp:300 }
];

/* ==========================================
   ITEMS
========================================== */
const items = [
  { id:"iron_sword", name:"Iron Knowledge Blade", icon:"⚔️", rarity:"Common", description:"+8 Damage",
    effect:function(){ state.damage+=8; } },
  { id:"protein_blade", name:"Protein Blade", icon:"🥩", rarity:"Rare", description:"+15 Damage",
    effect:function(){ state.damage+=15; } },
  { id:"brain", name:"Knowledge Core", icon:"🧠", rarity:"Rare", description:"+25% XP",
    effect:function(){ state.xpNeeded=Math.max(50, state.xpNeeded-20); } },
  { id:"heart", name:"Healthy Heart", icon:"❤️", rarity:"Common", description:"+25 Max HP",
    effect:function(){ state.maxHp+=25; state.hp+=25; } },
  { id:"crit", name:"Critical Thinking", icon:"🎯", rarity:"Epic", description:"+15% Critical Chance",
    effect:function(){ state.critChance+=15; } },
  { id:"shield", name:"Knowledge Shield", icon:"🛡️", rarity:"Rare", description:"Blockerar 1 fel attack",
    effect:function(){ state.shield++; } },
  { id:"gold", name:"Golden Apple", icon:"🍎", rarity:"Common", description:"+50 Gold",
    effect:function(){ state.gold+=50; } },
  { id:"potion", name:"Läkande Elixir", icon:"🧪", rarity:"Common", description:"Använd i strid: läker 30 HP", consumable:true, useContext:"battle" },
  { id:"bomb", name:"Kunskaps-Bomb", icon:"💣", rarity:"Rare", description:"Använd i strid: 30 skada på vald fiende", consumable:true, useContext:"battle" },
  { id:"focus", name:"Fokus-Bär", icon:"🍇", rarity:"Rare", description:"Använd i strid: nästa träff blir kritisk", consumable:true, useContext:"battle" },
  { id:"warp", name:"Warp-sten", icon:"🌀", rarity:"Rare", description:"Använd i dungeon: spara eller teleportera till varp-punkter", consumable:true, useContext:"dungeon" }
];

/* ==========================================
   UTILITIES
========================================== */
function randomItem(array){ return array[Math.floor(Math.random()*array.length)]; }
function shuffle(array){
  const copy=[...array];
  for(let i=copy.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
  return copy;
}
function getItem(){
  const roll=Math.random();
  if(roll<.08){ return items.find(x=>x.rarity==="Epic"); }
  if(roll<.35){ const rare=items.filter(x=>x.rarity==="Rare"); return randomItem(rare); }
  const common=items.filter(x=>x.rarity==="Common"); return randomItem(common);
}
function addToInventory(item){
  if(item.consumable){
    const existing=state.inventory.find(i=>i.id===item.id);
    if(existing){ existing.count=(existing.count||1)+1; return; }
    state.inventory.push({...item, count:1});
  } else {
    state.inventory.push({...item, count:1});
    if(item.effect) item.effect();
  }
}

/* ==========================================
   STATS / SAVE
========================================== */
function updateStats(){
  document.getElementById("hpStat").textContent = Math.max(0,state.hp)+"/"+state.maxHp;
  document.getElementById("damageStat").textContent = state.damage;
  document.getElementById("levelStat").textContent = state.level;
  document.getElementById("goldStat").textContent = state.gold;
  saveGame();
}
function saveGame(){
  const toSave = {...state, room:null, inventory: state.inventory.map(i=>({id:i.id,count:i.count||1}))};
  localStorage.setItem("nutriRogueSave", JSON.stringify(toSave));
}

/* ==========================================
   NEW RUN
========================================== */
function newRun(){
  state.hp=100; state.maxHp=100; state.level=1; state.xp=0; state.xpNeeded=100;
  state.gold=0; state.damage=20; state.critChance=0; state.shield=0; state.streak=0;
  state.guaranteedCrit=false; state.inventory=[]; state.warpPoints=[]; state.usedQuestions=[]; state.itemMessage="";
  state.room=null;
  state.dungeon = generateDungeon();
  state.playerPos = {x:state.dungeon.start.x, y:state.dungeon.start.y};
  updateStats();
  showDungeon();
}

/* ==========================================
   DUNGEON GENERATION (Rogue Legacy style square rooms)
========================================== */
function generateDungeon(){
  const cells=[];
  for(let y=0;y<GRID;y++){
    const row=[];
    for(let x=0;x<GRID;x++){
      row.push({x,y,exists:false,type:null,visited:false,revealed:false,completed:false,connections:[]});
    }
    cells.push(row);
  }
  const startX=Math.floor(GRID/2), startY=Math.floor(GRID/2);
  cells[startY][startX].exists=true;
  cells[startY][startX].type="start";
  cells[startY][startX].visited=true;
  cells[startY][startX].revealed=true;
  cells[startY][startX].completed=true;

  const roomCount=18;
  let frontier=[{x:startX,y:startY}];
  let created=1;
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  const dist={};
  dist[startX+","+startY]=0;

  while(created<roomCount && frontier.length){
    const idx=Math.floor(Math.random()*frontier.length);
    const cur=frontier[idx];
    let placed=false;
    for(const [dx,dy] of shuffle(dirs)){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(nx<0||nx>=GRID||ny<0||ny>=GRID) continue;
      if(cells[ny][nx].exists) continue;
      cells[ny][nx].exists=true;
      cells[cur.y][cur.x].connections.push(nx+","+ny);
      cells[ny][nx].connections.push(cur.x+","+cur.y);
      dist[nx+","+ny]=dist[cur.x+","+cur.y]+1;
      frontier.push({x:nx,y:ny});
      created++; placed=true;
      break;
    }
    if(!placed) frontier.splice(idx,1);
  }

  let farthest={x:startX,y:startY,d:0};
  for(const key in dist){
    if(dist[key]>farthest.d){
      const [x,y]=key.split(",").map(Number);
      farthest={x,y,d:dist[key]};
    }
  }
  cells[farthest.y][farthest.x].type="boss";

  const roomTypes=["battle","battle","battle","elite","shop","treasure","rest","mystery"];
  for(let y=0;y<GRID;y++){
    for(let x=0;x<GRID;x++){
      const c=cells[y][x];
      if(c.exists && !c.type) c.type=randomItem(roomTypes);
    }
  }

  cells[startY][startX].connections.forEach(function(key){
    const [x,y]=key.split(",").map(Number);
    cells[y][x].revealed=true;
  });

  return { cells, start:{x:startX,y:startY} };
}

function nodeInfo(type){
  const data={
    start:["🏁","Start"], battle:["⚔️","Battle"], elite:["🔥","Elite"], shop:["🏪","Shop"],
    treasure:["🎁","Skatt"], rest:["❤️","Vila"], mystery:["❓","Mysterium"], boss:["👑","Boss"]
  };
  return data[type];
}

function showDungeon(){

  let html=`
  <div class="dungeon-title">
    <div class="badge">DUNGEON</div>
    <h2>🗺️ Näringsriket</h2>

      if(!c.exists){
        classes+=" empty";
      } else if(!c.revealed){
        classes+=" hidden";
      } else if(!c.visited){
        classes+=" fog";
        content="❓";
      } else if(!c.completed){
        classes+=" pending";
        content=nodeInfo(c.type)[0];
      } else {
        classes+=" cleared type-"+c.type;
        content=nodeInfo(c.type)[0];
      }
      if(isPlayer){
        classes+=" current";
        content="🧑‍🚀";
      }
      html+=`<div class="${classes}">${content}</div>`;
    }
  }

  html+=`
    </div>
  </div>
  <div class="dpad-wrap">
    <div class="dpad">
      <button class="btn k-w" onclick="move(0,-1)">W ↑</button>
      <button class="btn k-a" onclick="move(-1,0)">A ←</button>
      <button class="btn k-s" onclick="move(0,1)">S ↓</button>
      <button class="btn k-d" onclick="move(1,0)">D →</button>
    </div>
    <p class="controls-hint">Gå in i ett rum för att utforska det. ⚔️ Battle, 🔥 Elite, 🏪 Shop, 🎁 Skatt, ❤️ Vila, ❓ Mysterium, 👑 Boss.</p>
  </div>
  `;

  const warpEntry = state.inventory.find(i=>i.id==="warp" && (i.count||0)>0);
  if(warpEntry){

    if(state.warpPoints.length>0){

      state.warpPoints.forEach(function(wp,i){
        const c=cells[wp.y][wp.x];
        html += `<button class="btn" onclick="teleportToWarp(${i})">📍 ${wp.label} ${nodeInfo(c.type)[0]}</button>`;
      });
      html += `</div>`;

/* ==========================================
   MOVEMENT (WASD) — DUNGEON GRID
========================================== */
function move(dx,dy){
  if(state.currentView!=="dungeon") return;
  const cells=state.dungeon.cells;
  const cur=state.playerPos;
  const nx=cur.x+dx, ny=cur.y+dy;
  if(nx<0||nx>=GRID||ny<0||ny>=GRID) return;
  const target=cells[ny][nx];
  if(!target.exists) return;
  const connected = cells[cur.y][cur.x].connections.includes(nx+","+ny);
  if(!connected) return;

  state.playerPos={x:nx,y:ny};
  target.revealed=true;
  target.visited=true;
  target.connections.forEach(function(key){
    const [rx,ry]=key.split(",").map(Number);
    cells[ry][rx].revealed=true;
  });

  if(target.type!=="start" && !target.completed){
    enterRoom(target);
  } else {
    showDungeon();
  }
}

document.addEventListener("keydown", function(e){
  const k=e.key.toLowerCase();
  if(state.currentView==="dungeon"){
    if(k==="w"||k==="arrowup") move(0,-1);
    else if(k==="s"||k==="arrowdown") move(0,1);
    else if(k==="a"||k==="arrowleft") move(-1,0);
    else if(k==="d"||k==="arrowright") move(1,0);
  } else if(state.currentView==="room" && state.room){
    if(k==="a"||k==="arrowleft") state.room.keys.a=true;
    else if(k==="d"||k==="arrowright") state.room.keys.d=true;
    else if(k==="w"||k==="arrowup"||k===" ") { state.room.keys.w=true; e.preventDefault(); }
  }
});
document.addEventListener("keyup", function(e){
  const k=e.key.toLowerCase();
  if(state.currentView==="room" && state.room){
    if(k==="a"||k==="arrowleft") state.room.keys.a=false;
    else if(k==="d"||k==="arrowright") state.room.keys.d=false;
    else if(k==="w"||k==="arrowup"||k===" ") state.room.keys.w=false;
  }
});

/* ==========================================
   WARP STONE
========================================== */
function setWarpPoint(){
  const entry=state.inventory.find(i=>i.id==="warp" && (i.count||0)>0);
  if(!entry) return;
  if(state.warpPoints.length>=3){ alert("Du kan bara ha 3 varp-punkter samtidigt."); return; }
  state.warpPoints.push({x:state.playerPos.x, y:state.playerPos.y, label:"Varp "+(state.warpPoints.length+1)});
  entry.count=(entry.count||1)-1;
  if(entry.count<=0) state.inventory=state.inventory.filter(i=>i!==entry);
  updateStats();
  showDungeon();
}
function teleportToWarp(i){
  const entry=state.inventory.find(it=>it.id==="warp" && (it.count||0)>0);
  if(!entry){ alert("Du har inga Warp-stenar kvar."); return; }
  const wp=state.warpPoints[i];
  if(!wp) return;
  state.playerPos={x:wp.x, y:wp.y};
  entry.count=(entry.count||1)-1;
  if(entry.count<=0) state.inventory=state.inventory.filter(it=>it!==entry);
  updateStats();
  showDungeon();
}

/* ==========================================
   PHYSICAL ROOM (platformer) — click an object to trigger its event
========================================== */
function buildRoomObjects(node){
  const objs=[];
  if(node.type==="battle"){
    const e={...randomItem(enemies)};
    objs.push({ icon:e.icon, label:e.name, x:480, onPlatform:false, action:function(){ startBattle([e]); } });
  } else if(node.type==="elite"){
    if(Math.random()<0.5){
      const e={...randomItem(eliteEnemies)};
      objs.push({ icon:e.icon, label:e.name, x:430, onPlatform:true, action:function(){ startBattle([e]); } });
    } else {
      const e1={...randomItem(enemies)}, e2={...randomItem(enemies)};
      objs.push({ icon:e1.icon, label:e1.name, x:280, onPlatform:false, action:function(){ startBattle([e1,e2]); } });
      objs.push({ icon:e2.icon, label:e2.name, x:540, onPlatform:false, action:function(){ startBattle([e1,e2]); } });
    }
  } else if(node.type==="boss"){
    const e={...randomItem(bosses)};
    objs.push({ icon:e.icon, label:e.name, x:450, onPlatform:true, action:function(){ startBattle([e], true); } });
  } else if(node.type==="shop"){
    objs.push({ icon:"🏪", label:"Nutri Shop", x:460, onPlatform:false, action:showShop });
  } else if(node.type==="treasure"){
    objs.push({ icon:"🎁", label:"Skattkista", x:460, onPlatform:false, action:showTreasure });
  } else if(node.type==="rest"){
    objs.push({ icon:"🔥", label:"Vilostuga", x:460, onPlatform:false, action:restRoom });
  } else if(node.type==="mystery"){
    objs.push({ icon:"❓", label:"Mysterium", x:460, onPlatform:false, action:mysteryRoom });
  }
  return objs;
}

function enterRoom(node){
  const objects=buildRoomObjects(node);
  if(objects.length===0){ node.completed=true; showDungeon(); return; }
  state.room={ node:node, objects:objects, playerX:40, playerY:0, vy:0, onGround:true, keys:{}, rafId:null };
  state.currentView="room";
  showRoom();
  state.room.rafId=requestAnimationFrame(roomFrame);
}

function showRoom(){
  const r=state.room;
  const info=nodeInfo(r.node.type);
  const needsPlatform = r.objects.some(o=>o.onPlatform);

  let objectsHtml="";
  r.objects.forEach(function(obj,i){
    const bottom=(obj.onPlatform?PLATFORM_Y:0)+GROUND_H;
    objectsHtml+=`<button class="room-object" style="left:${obj.x}px; bottom:${bottom}px" onclick="triggerRoomObject(${i})" title="${obj.label}">${obj.icon}</button>`;
  });

  document.getElementById("game").innerHTML=`
    <div class="dungeon-title">
      <div class="badge">${info[1].toUpperCase()}</div>
      <h2>${info[0]} Rum</h2>
      <p>Klicka på figuren i rummet för att interagera. Gå med A/D, hoppa med W eller mellanslag.</p>
    </div>
    <div class="room-stage-wrap">
      <div class="room-stage" id="roomStage">
        <div class="room-ground"></div>
        ${needsPlatform?`<div class="room-platform" style="left:${PLATFORM_X}px;width:${PLATFORM_W}px;bottom:${PLATFORM_Y+GROUND_H}px"></div>`:""}
        ${objectsHtml}
        <div class="room-player" id="roomPlayer">🧑‍🚀</div>
      </div>
    </div>
    <div class="room-controls">
      <button class="btn" onmousedown="roomKeyDown('a')" onmouseup="roomKeyUp('a')" onmouseleave="roomKeyUp('a')" ontouchstart="roomKeyDown('a')" ontouchend="roomKeyUp('a')">◀️</button>
      <button class="btn primary" onclick="roomJump()">⤴️ Hoppa</button>
      <button class="btn" onmousedown="roomKeyDown('d')" onmouseup="roomKeyUp('d')" onmouseleave="roomKeyUp('d')" ontouchstart="roomKeyDown('d')" ontouchend="roomKeyUp('d')">▶️</button>
    </div>
    <div class="button-row" style="justify-content:center">
      <button class="btn" onclick="leaveRoom()">🚪 Lämna rummet</button>
    </div>
  `;
  updateRoomPlayerPosition();
}

function roomKeyDown(k){ if(state.room) state.room.keys[k]=true; }
function roomKeyUp(k){ if(state.room) state.room.keys[k]=false; }
function roomJump(){
  if(state.room && state.room.onGround){
    state.room.vy=JUMP_V;
    state.room.onGround=false;
  }
}

function resolveVertical(r){
  const overlapX = (r.playerX+PLAYER_W>PLATFORM_X) && (r.playerX<PLATFORM_X+PLATFORM_W);
  const prevY=r.playerY;
  r.vy-=GRAVITY;
  r.playerY+=r.vy;

  if(overlapX && prevY>=PLATFORM_Y && r.playerY<=PLATFORM_Y && r.vy<0){
    r.playerY=PLATFORM_Y; r.vy=0; r.onGround=true; return;
  }
  if(overlapX && Math.abs(prevY-PLATFORM_Y)<0.8 && r.vy<=0){
    r.playerY=PLATFORM_Y; r.vy=0; r.onGround=true; return;
  }
  if(r.playerY<=0){
    r.playerY=0; r.vy=0; r.onGround=true; return;
  }
  r.onGround=false;
}

function roomFrame(){
  if(state.currentView!=="room" || !state.room) return;
  const r=state.room;
  if(r.keys.a) r.playerX-=MOVE_SPEED;
  if(r.keys.d) r.playerX+=MOVE_SPEED;
  r.playerX=Math.max(10, Math.min(ROOM_W-PLAYER_W-10, r.playerX));

  if(r.keys.w && r.onGround){ r.vy=JUMP_V; r.onGround=false; }
  resolveVertical(r);

  updateRoomPlayerPosition();
  r.rafId=requestAnimationFrame(roomFrame);
}

function updateRoomPlayerPosition(){
  if(!state.room) return;
  const el=document.getElementById("roomPlayer");
  if(!el) return;
  el.style.left=state.room.playerX+"px";
  el.style.bottom=(state.room.playerY+GROUND_H)+"px";
}

function cancelRoomLoop(){
  if(state.room && state.room.rafId) cancelAnimationFrame(state.room.rafId);
}

function triggerRoomObject(i){
  if(!state.room) return;
  const obj=state.room.objects[i];
  const node=state.room.node;
  if(!obj) return;
  node.completed=true;
  cancelRoomLoop();
  state.room=null;
  obj.action();
}

function leaveRoom(){
  cancelRoomLoop();
  state.room=null;
  showDungeon();
}

/* ==========================================
   BATTLE
========================================== */
function startBattle(enemyList, boss){
  boss = !!boss;
  state.currentEnemies=enemyList.map(function(e){
    return {...e, maxHp:e.hp, currentHp:e.hp, boss:boss, elite:enemyList.length===1 && e.hp>150 && !boss};
  });
  state.targetIndex=0;
  state.currentQuestion=getQuestion();
  state.itemMessage="";
  showBattle();
}

function getQuestion(){
  let available=questions.filter(q=>!state.usedQuestions.includes(q.id));
  if(available.length===0){ state.usedQuestions=[]; available=questions; }
  const q=randomItem(available);
  state.usedQuestions.push(q.id);
  return q;
}

function getCurrentTarget(){ return state.currentEnemies[state.targetIndex]; }

function selectTarget(index){
  if(state.currentEnemies[index].currentHp<=0) return;
  state.targetIndex=index;
  showBattle();
}

function showBattle(){
  state.currentView="battle";
  const q=state.currentQuestion;

  let enemyHtml="";
  state.currentEnemies.forEach(function(enemy,idx){
    const dead=enemy.currentHp<=0;
    const selected=idx===state.targetIndex && !dead;
    enemyHtml+=`
    <div class="fighter enemy-target ${selected?"selected":""} ${dead?"dead":""}" onclick="selectTarget(${idx})">
      <div class="fighter-icon">${enemy.icon}</div>
      <div class="fighter-name">${enemy.name}</div>
      <div class="health-bar"><div class="health-fill enemy-health" style="width:${Math.max(0,enemy.currentHp/enemy.maxHp*100)}%"></div></div>
      <div class="hp-text">❤️ ${Math.max(0,enemy.currentHp)}/${enemy.maxHp}</div>
    </div>`;
  });

  document.getElementById("game").innerHTML=`
    <div class="battle-top">
      <div class="player-side">
        <div class="fighter">
          <div class="fighter-icon">🧑‍🚀</div>
          <div class="fighter-name">Level ${state.level} Student</div>
          <div class="health-bar"><div class="health-fill player-health" style="width:${Math.max(0,state.hp)/state.maxHp*100}%"></div></div>
          <div class="hp-text">❤️ ${Math.max(0,state.hp)}/${state.maxHp}</div>
        </div>
      </div>
      <div class="vs">⚔️</div>
      <div class="enemy-side">
        ${state.currentEnemies.length>1?'<div class="target-hint">Klicka på en fiende för att välja mål</div>':""}
        ${enemyHtml}
      </div>
    </div>

    <div class="question-box">
      <div class="badge">${q.topic}</div>
      <h2 class="question">${q.question}</h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      ${state.itemMessage?`<div class="item-msg">${state.itemMessage}</div>`:""}
      <div class="button-row">
        <button class="btn primary" id="attackButton" onclick="checkAnswer()">⚔️ Attackera</button>
        <button class="btn" onclick="showHint()">💡 Hint</button>
        <button class="btn green" id="continueButton" style="display:none" onclick="continueBattle()">Fortsätt →</button>
      </div>
    </div>

    ${renderInventory("battle")}
  `;

  renderQuestion(q);
}

/* ==========================================
   INVENTORY RENDER
========================================== */
function renderInventory(context){
  if(state.inventory.length===0) return "";
  let html=`<h3 style="margin-top:25px;margin-bottom:10px">🎒 Inventory</h3><div class="inventory">`;
  state.inventory.forEach(function(item){
    const showUse = context && item.consumable && item.useContext===context && (item.count||1)>0;
    html+=`
    <div class="item-card">
      <div class="icon">${item.icon}</div>
      <strong>${item.name}${item.consumable?" x"+(item.count||1):""}</strong>
      <small>${item.description}</small>
      ${showUse?`<button class="btn use-btn" onclick="useItem('${item.id}')">Använd</button>`:""}
    </div>`;
  });
  html+=`</div>`;
  return html;
}

/* ==========================================
   USE ITEM (battle-context consumables)
========================================== */
function useItem(id){
  const entry=state.inventory.find(i=>i.id===id && i.consumable && (i.count||1)>0);
  if(!entry) return;

  if(id==="potion"){
    const heal=30;
    state.hp=Math.min(state.maxHp, state.hp+heal);
    state.itemMessage=`🧪 Du använde ${entry.name} och läkte ${heal} HP!`;
  } else if(id==="bomb"){
    const target=getCurrentTarget();
    if(target && target.currentHp>0){
      target.currentHp=Math.max(0, target.currentHp-30);
      state.itemMessage=`💣 Du använde ${entry.name} och gjorde 30 skada mot ${target.name}!`;
    } else {
      state.itemMessage="💣 Det finns ingen levande fiende att rikta mot just nu.";
    }
  } else if(id==="focus"){
    state.guaranteedCrit=true;
    state.itemMessage=`🍇 Du använde ${entry.name}. Din nästa träff blir kritisk!`;
  }

  entry.count=(entry.count||1)-1;
  if(entry.count<=0) state.inventory=state.inventory.filter(i=>i!==entry);
  updateStats();
  if(state.currentView==="battle") showBattle();
}

/* ==========================================
   RENDER QUESTION
========================================== */
function renderQuestion(q){
  const container=document.getElementById("answers");

  if(q.type==="choice"){
    shuffle(q.options).forEach(function(option){
      const button=document.createElement("button");
      button.className="answer";
      button.textContent=option[0];
      button.dataset.correct=option[1];
      button.onclick=function(){
        document.querySelectorAll(".answer").forEach(b=>b.classList.remove("selected"));
        button.classList.add("selected");
      };
      container.appendChild(button);
    });
  }

  if(q.type==="truefalse"){
    [["✓ Sant",true],["✕ Falskt",false]].forEach(function(option){
      const button=document.createElement("button");
      button.className="answer";
      button.textContent=option[0];
      button.dataset.value=option[1];
      button.onclick=function(){
        document.querySelectorAll(".answer").forEach(b=>b.classList.remove("selected"));
        button.classList.add("selected");
      };
      container.appendChild(button);
    });
  }

  if(q.type==="text"){
    container.innerHTML=`<textarea id="textAnswer" placeholder="Skriv ditt svar med egna ord..."></textarea>`;
  }

  if(q.type==="blank"){
    container.innerHTML=`<input id="blankAnswer" placeholder="Skriv ditt svar...">`;
  }

  if(q.type==="drag"){
    renderDrag(q, container);
  }
}

/* ==========================================
   DRAG AND DROP
========================================== */
function renderDrag(q, container){
  container.innerHTML=`<div class="drag-pool" id="dragPool"></div><div class="drop-grid" id="dropGrid"></div>`;
  const pool=document.getElementById("dragPool");

  shuffle(q.items).forEach(function(item){
    const el=document.createElement("div");
    el.className="drag-item";
    el.id="drag-"+item[0];
    el.textContent=item[1];
    el.draggable=true;
    el.dataset.category=item[2];
    el.addEventListener("dragstart", function(e){ e.dataTransfer.setData("text/plain", el.id); });
    pool.appendChild(el);
  });

  const grid=document.getElementById("dropGrid");
  q.categories.forEach(function(category){
    const zone=document.createElement("div");
    zone.className="drop-zone";
    zone.dataset.category=category[0];
    zone.innerHTML=`<h3>${category[1]}</h3>`;
    zone.addEventListener("dragover", function(e){ e.preventDefault(); zone.classList.add("over"); });
    zone.addEventListener("dragleave", function(){ zone.classList.remove("over"); });
    zone.addEventListener("drop", function(e){
      e.preventDefault();
      zone.classList.remove("over");
      const id=e.dataTransfer.getData("text/plain");
      const item=document.getElementById(id);
      if(item) zone.appendChild(item);
    });
    grid.appendChild(zone);
  });
}

/* ==========================================
   CHECK ANSWER (async, AI-graded free text)
========================================== */
async function checkAnswer(){
  const q=state.currentQuestion;
  let score=0;
  let aiFeedback="";

  if(q.type==="choice"){
    const selected=document.querySelector(".answer.selected");
    if(!selected){ alert("Välj ett svar först!"); return; }
    score = selected.dataset.correct==="true" ? 100 : 0;
  }
  else if(q.type==="truefalse"){
    const selected=document.querySelector(".answer.selected");
    if(!selected){ alert("Välj Sant eller Falskt!"); return; }
    const value = selected.dataset.value==="true";
    score = value===q.correct ? 100 : 0;
  }
  else if(q.type==="text"){
    const answerEl=document.getElementById("textAnswer");
    const answer=answerEl.value;
    if(answer.trim().length<4){ alert("Skriv ett lite längre svar."); return; }

    const attackButton=document.getElementById("attackButton");
    attackButton.disabled=true;
    const feedback=document.getElementById("feedback");
    feedback.className="feedback show loading";
    feedback.innerHTML="🤖 AI bedömer ditt svar...";

    const ai = await interpretAnswerAI(answer, q);
    score = ai.score;
    aiFeedback = ai.feedback;
  }
  else if(q.type==="blank"){
    const answer=document.getElementById("blankAnswer").value.toLowerCase().trim();
    score = q.answers.some(a=>answer.includes(a)) ? 100 : 0;
  }
  else if(q.type==="drag"){
    let correct=0;
    q.items.forEach(function(item){
      const el=document.getElementById("drag-"+item[0]);
      if(el && el.parentElement.dataset.category===item[2]) correct++;
    });
    score = Math.round(correct/q.items.length*100);
  }

  resolveAnswer(score, aiFeedback);
}

/* ==========================================
   AI TEXT GRADING (calls Claude; falls back to local keyword check)
========================================== */
async function interpretAnswerAI(answer, question){
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:300,
        messages:[{
          role:"user",
          content:
`Du är en snäll, uppmuntrande lärare i näringslära för en elev i årskurs 7 i Sverige.
Fråga: "${question.question}"
Elevens svar: "${answer}"

Bedöm hur väl svaret förklarar näringsämnet på en skala 0-100 (0 = helt fel/orelevant, 100 = utmärkt och korrekt förklaring).
Ge kort, uppmuntrande feedback på svenska (max två meningar), anpassad för en 13-åring.
Svara ENDAST med giltig JSON i exakt detta format, utan extra text:
{"score": <heltal 0-100>, "feedback": "<text på svenska>"}`
        }]
      })
    });

    if(!response.ok) throw new Error("API svarade med status "+response.status);

    const data=await response.json();
    const text=(data.content||[]).map(b=>b.text||"").join("");
    const clean=text.replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(clean);

    const score=Math.max(0, Math.min(100, Math.round(Number(parsed.score)||0)));
    return {
      score:score,
      feedback:`🤖 <strong>AI-bedömning:</strong> ${parsed.feedback}`
    };
  } catch(err){
    console.warn("AI-bedömning misslyckades, använder lokal bedömning istället:", err);
    return interpretAnswerLocal(answer, question);
  }
}

function interpretAnswerLocal(answer, question){
  const text=answer.toLowerCase();
  let matches=0;
  question.keywords.forEach(function(keyword){ if(text.includes(keyword)) matches++; });
  const words=text.split(/\s+/).length;
  let score=25 + matches/question.keywords.length*65 + Math.min(words/30,1)*10;
  score=Math.round(Math.min(100,score));

  let feedback="";
  if(score>=85){ feedback=`🤖 <strong>AI Interpret:</strong> Mycket bra! Ditt svar innehåller flera viktiga idéer.`; }
  else if(score>=60){ feedback=`🤖 <strong>AI Interpret:</strong> Bra resonemang. Du har förstått delar av ämnet.`; }
  else{ feedback=`🤖 <strong>AI Interpret:</strong> Du är på väg åt rätt håll. Försök förklara lite mer exakt vad som händer i kroppen.`; }

  return { score:score, feedback:feedback };
}

/* ==========================================
   DAMAGE RESOLUTION
========================================== */
function resolveAnswer(score, aiFeedback){
  const target=getCurrentTarget();
  let damage=0;
  let enemyDamage=0;
  let type="wrong";
  let crit=false;

  if(score>=80){
    type="correct";
    state.streak++;
    damage=state.damage;
    if(state.guaranteedCrit || Math.random()*100<state.critChance){
      crit=true;
      damage*=2;
      state.guaranteedCrit=false;
    }
    damage+=state.streak*2;
    gainXP(40);
    state.gold+=10;
  }
  else if(score>=50){
    type="partial";
    damage=Math.round(state.damage*.55);
    gainXP(20);
    state.gold+=4;
    state.streak=0;
  }
  else{
    state.streak=0;
    if(state.shield>0){
      state.shield--;
    } else {
      const aliveCount=state.currentEnemies.filter(e=>e.currentHp>0).length;
      const perEnemy = (target && target.boss) ? 20 : (target && target.elite) ? 14 : 8;
      enemyDamage = perEnemy * Math.max(1,aliveCount);
      state.hp-=enemyDamage;
    }
  }

  if(target){
    target.currentHp-=damage;
    if(target.currentHp<0) target.currentHp=0;
    if(target.currentHp<=0){
      const nextAlive=state.currentEnemies.findIndex(e=>e.currentHp>0);
      if(nextAlive!==-1) state.targetIndex=nextAlive;
    }
  }
  if(state.hp<0) state.hp=0;

  state.itemMessage="";
  showFeedback(score, damage, enemyDamage, type, crit, aiFeedback);
  updateStats();
}

/* ==========================================
   XP LEVELING
========================================== */
function gainXP(amount){
  state.xp+=amount;
  while(state.xp>=state.xpNeeded){
    state.xp-=state.xpNeeded;
    state.level++;
    state.xpNeeded=Math.floor(state.xpNeeded*1.25);
    state.damage+=3;
    state.maxHp+=5;
    state.hp=Math.min(state.maxHp, state.hp+15);
  }
}

/* ==========================================
   SHOW FEEDBACK
========================================== */
function showFeedback(score, damage, enemyDamage, type, crit, aiFeedback){
  const q=state.currentQuestion;
  const feedback=document.getElementById("feedback");
  feedback.className="feedback show "+type;

  let title="❌ Miss";
  if(score>=80) title="⚔️ Stark attack!";
  else if(score>=50) title="✨ Delvis träff!";

  feedback.innerHTML=`
    <h3>${title}</h3>
    <p>Score: <strong>${score}/100</strong></p>
    ${aiFeedback||""}
    <p><strong>Förklaring:</strong><br>${q.explanation}</p>
    ${damage>0?`<p>⚔️ Du gjorde <strong>${damage}</strong> damage.${crit?" 🎯 CRITICAL HIT!":""}</p>`:""}
    ${enemyDamage>0?`<p>💥 Fienden gjorde <strong>${enemyDamage}</strong> damage.</p>`:""}
  `;

  document.querySelectorAll(".enemy-target").forEach(function(el,idx){
    const enemy=state.currentEnemies[idx];
    const bar=el.querySelector(".health-fill");
    const txt=el.querySelector(".hp-text");
    if(bar) bar.style.width=Math.max(0,enemy.currentHp/enemy.maxHp*100)+"%";
    if(txt) txt.textContent="❤️ "+Math.max(0,enemy.currentHp)+"/"+enemy.maxHp;
    if(enemy.currentHp<=0) el.classList.add("dead");
  });

  const attackButton=document.getElementById("attackButton");
  attackButton.disabled=false;
  attackButton.style.display="none";
  document.getElementById("continueButton").style.display="inline-block";
}

/* ==========================================
   CONTINUE BATTLE
========================================== */
function continueBattle(){
  if(state.hp<=0){ gameOver(); return; }

  const allDead=state.currentEnemies.every(e=>e.currentHp<=0);
  if(allDead){ battleVictory(); return; }

  state.currentQuestion=getQuestion();
  state.itemMessage="";
  showBattle();
}

/* ==========================================
   BATTLE VICTORY
========================================== */
function battleVictory(){
  const isBoss=state.currentEnemies.some(e=>e.boss);
  let gold=0, xp=0;
  state.currentEnemies.forEach(function(e){ gold+=e.gold; xp+=e.xp; });
  state.gold+=gold;
  gainXP(xp);
  updateStats();

  if(isBoss){ victory(); return; }
  showRewardScreen(gold, xp);
}

/* ==========================================
   REWARD SCREEN
========================================== */
function showRewardScreen(gold, xp){
  state.currentView="event";
  const rewards=[getItem(), getItem(), getItem()];
  document.getElementById("game").innerHTML=`
    <div style="text-align:center">
      <div class="result-icon">🏆</div>
      <h2>Fiende besegrad!</h2>
      <p class="story">Du hittade ${gold} Gold och ${xp} XP. Välj ett item.</p>
      <div class="reward-grid" id="rewardGrid"></div>
    </div>
  `;
  const grid=document.getElementById("rewardGrid");
  rewards.forEach(function(item){
    const card=document.createElement("button");
    card.className="reward-card";
    card.innerHTML=`
      <div class="big-icon">${item.icon}</div>
      <h3>${item.name}</h3>
      <p>${item.description}</p>
      <small>${item.rarity}</small>
    `;
    card.onclick=function(){ takeItem(item); };
    grid.appendChild(card);
  });
}

/* ==========================================
   TAKE ITEM
========================================== */
function takeItem(item){
  state.currentView="event";
  addToInventory(item);
  updateStats();

  document.getElementById("game").innerHTML=`
    <div class="result">
      <div class="result-icon">${item.icon}</div>
      <h2>Item hittat!</h2>
      <h3>${item.name}</h3>
      <p class="story">${item.description}</p>
      <button class="btn primary" onclick="showDungeon()">🗺️ Fortsätt äventyret</button>
    </div>
  `;
}

/* ==========================================
   SHOP
========================================== */
const shopItems=[
  { name:"⚔️ Damage Upgrade", cost:35, description:"+7 Damage", buy:function(){ state.damage+=7; } },
  { name:"❤️ Max Health", cost:40, description:"+20 Max HP", buy:function(){ state.maxHp+=20; state.hp+=20; } },
  { name:"🛡️ Shield", cost:30, description:"Blockerar nästa felattack", buy:function(){ state.shield++; } },
  { name:"📚 XP Boost", cost:50, description:"+50 XP direkt", buy:function(){ gainXP(50); } },
  { name:"🧪 Läkande Elixir", cost:20, description:"Använd i strid: läker 30 HP",
    buy:function(){ addToInventory(items.find(i=>i.id==="potion")); } },
  { name:"🌀 Warp-sten", cost:45, description:"Använd i dungeon: spara/teleportera varp-punkter",
    buy:function(){ addToInventory(items.find(i=>i.id==="warp")); } }
];

function showShop(){
  state.currentView="event";
  let html=`
    <div style="text-align:center">
      <div class="badge">SHOP</div>
      <h2>🏪 Nutri Shop</h2>
      <p class="story">Du har 💰 ${state.gold} Gold</p>
    </div>
    <div class="shop-grid" id="shopGrid"></div>
    <div class="button-row" style="justify-content:center">
      <button class="btn" onclick="showDungeon()">← Lämna</button>
    </div>
  `;
  document.getElementById("game").innerHTML=html;
  const grid=document.getElementById("shopGrid");
  shopItems.forEach(function(item,index){
    const card=document.createElement("div");
    card.className="shop-item";
    card.innerHTML=`
      <h3>${item.name}</h3>
      <p>${item.description}</p>
      <div class="cost">💰 ${item.cost}</div>
      <button class="btn primary" onclick="buyShopItem(${index})">Köp</button>
    `;
    grid.appendChild(card);
  });
}

function buyShopItem(index){
  const item=shopItems[index];
  if(state.gold<item.cost){ alert("Inte tillräckligt med Gold!"); return; }
  state.gold-=item.cost;
  item.buy();
  updateStats();
  showShop();
}

/* ==========================================
   TREASURE
========================================== */
function showTreasure(){
  state.currentView="event";
  const item=getItem();
  document.getElementById("game").innerHTML=`
    <div class="result">
      <div class="result-icon">🎁</div>
      <h2>Skattkista!</h2>
      <div class="reward-card">
        <div class="big-icon">${item.icon}</div>
        <h3>${item.name}</h3>
        <p>${item.description}</p>
      </div>
      <div class="button-row" style="justify-content:center">
        <button class="btn primary" onclick="takeTreasure()">Ta item</button>
      </div>
    </div>
  `;
  window.treasureItem=item;
}
function takeTreasure(){ takeItem(window.treasureItem); }

/* ==========================================
   REST
========================================== */
function restRoom(){
  state.currentView="event";
  const heal=Math.round(state.maxHp*.35);
  state.hp=Math.min(state.maxHp, state.hp+heal);
  updateStats();
  document.getElementById("game").innerHTML=`
    <div class="result">
      <div class="result-icon">🔥❤️</div>
      <h2>Vilostuga</h2>
      <p class="story">Du tar en paus och återhämtar dig.</p>
      <h3>+${heal} HP</h3>
      <button class="btn primary" onclick="showDungeon()">Fortsätt</button>
    </div>
  `;
}

/* ==========================================
   MYSTERY
========================================== */
function mysteryRoom(){
  state.currentView="event";
  const events=[
    { text:"📚 Du hittar en gammal bok.", effect:function(){ gainXP(70); } },
    { text:"💰 Du hittar ett gömt guldförråd.", effect:function(){ state.gold+=40; } },
    { text:"❤️ Du hittar en återhämtningskälla.", effect:function(){ state.hp=Math.min(state.maxHp, state.hp+25); } },
    { text:"🎁 Du hittar ett mystiskt item.", effect:function(){ addToInventory(getItem()); } }
  ];
  const event=randomItem(events);
  event.effect();
  updateStats();
  document.getElementById("game").innerHTML=`
    <div class="result">
      <div class="result-icon">❓</div>
      <h2>Mysterium</h2>
      <p class="story">${event.text}</p>
      <button class="btn primary" onclick="showDungeon()">Fortsätt</button>
    </div>
  `;
}

/* ==========================================
   HINT
========================================== */
function showHint(){
  const q=state.currentQuestion;
  let hint="Fundera på vilken uppgift detta näringsämne har i kroppen.";
  if(q.topic==="Protein") hint="💡 Tänk på muskler, kroppens byggmaterial och reparation.";
  if(q.topic==="Kolhydrater") hint="💡 Tänk på energi och vanliga energirika livsmedel.";
  if(q.topic==="Vatten") hint="💡 Fundera på svettning, kroppens temperatur och transport.";
  if(q.topic==="Vitaminer") hint="💡 De behövs i små mängder men har viktiga funktioner.";

  const feedback=document.getElementById("feedback");
  feedback.className="feedback show partial";
  feedback.innerHTML=`<h3>💡 AI Hint</h3><p>${hint}</p>`;
}

/* ==========================================
   VICTORY (boss defeated)
========================================== */
function victory(){
  state.currentView="event";
  localStorage.removeItem("nutriRogueSave");
  document.getElementById("game").innerHTML=`
    <div class="result">
      <div class="result-icon">👑</div>
      <h2>Slottet befriat!</h2>
      <p class="story">
        Du besegrade Näringsmästaren på Level ${state.level} med ${state.gold} Gold i fickan.
        Näringsriket är räddat!
      </p>
      <button class="btn primary" onclick="newRun()">🔄 Ny run</button>
    </div>
  `;
}

/* ==========================================
   GAME OVER
========================================== */
function gameOver(){
  state.currentView="event";
  localStorage.removeItem("nutriRogueSave");
  document.getElementById("game").innerHTML=`
    <div class="result">
      <div class="result-icon">💀</div>
      <h2>Run Over</h2>
      <p class="story">
        Du nådde Level ${state.level} och samlade ${state.gold} Gold.
        Nästa run kan bli starkare.
      </p>
      <button class="btn primary" onclick="newRun()">🔄 New Run</button>
    </div>
  `;
}

/* ==========================================
   START SCREEN
========================================== */
function showStart(){
  state.currentView="start";
  document.getElementById("game").innerHTML=`
    <div class="start-screen">
      <div class="start-icon">🧬⚔️</div>
      <h2>NutriRogue</h2>
      <p>
        Ett roguelite-äventyr där du utforskar ett slott av dolda rum. I varje rum rör du dig
        som i ett plattformsspel — klicka på figuren du möter för att starta strid, handla,
        vila eller upptäcka mysterier. Rör dig mellan rum med WASD.
        Varje run är annorlunda. Levla upp. Samla Gold. Hitta items. Bli starkare.
      </p>
      <div class="button-row" style="justify-content:center">
        <button class="btn primary" onclick="newRun()">⚔️ Starta ny run</button>
        <button class="btn" onclick="loadGame()">💾 Ladda sparad run</button>
      </div>
    </div>
  `;
}

/* ==========================================
   LOAD
========================================== */
function loadGame(){
  const saved=localStorage.getItem("nutriRogueSave");
  if(!saved){ alert("Ingen sparad run hittades!"); return; }
  const data=JSON.parse(saved);

  Object.assign(state, data);
  state.room=null;

  state.inventory = (data.inventory||[]).map(function(saved){
    const proto=items.find(i=>i.id===saved.id);
    return proto ? {...proto, count:saved.count||1} : saved;
  });

  if(!state.dungeon){ newRun(); return; }

  updateStats();
  showDungeon();
}

/* ==========================================
   INITIALIZE
========================================== */
showStart();
updateStats();
</script>
